name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          if "$SDKMANAGER" "platforms;android-37.0" > /dev/null 2>&1; then
            echo "已安装 platforms;android-37.0"
            "$SDKMANAGER" "build-tools;37.0.0" > /dev/null 2>&1 \
              || "$SDKMANAGER" "build-tools;36.0.0" > /dev/null
          else
            echo "platforms;android-37.0 不可用，回退到 android-36"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts core/data/build.gradle.kts
            sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
            echo "COMPILE_SDK_FALLBACK=36" >> "$GITHUB_ENV"
          fi

      - name: Compute version
        id: meta
        run: echo "version=0.1.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee build.log

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.meta.outputs.version }} \
            2>&1 | tee -a build.log

      - name: Verify APK has no INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "::error::找不到 aapt2，无法校验权限"
            exit 1
          fi
          echo "使用 $AAPT2 检查 $APK"
          PERMS="$("$AAPT2" dump permissions "$APK" 2>/dev/null || true)"
          if [ -z "$PERMS" ]; then
            PERMS="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"
          fi
          echo "$PERMS" | head -n 40
          if echo "$PERMS" | grep -qi 'android.permission.INTERNET'; then
            echo "::error::APK 仍然声明了 android.permission.INTERNET"
            exit 1
          fi
          echo "OK：APK 未声明 INTERNET 权限"

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk autoledger.apk

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          : > diagnostics.txt
          if [ -f build.log ]; then
            grep -E '^e: |error:|What went wrong' build.log >> diagnostics.txt
            grep -A12 'What went wrong' build.log >> diagnostics.txt
          fi
          python3 - >> diagnostics.txt <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  failed = case.find('failure') is not None or case.find('error') is not None
                  if failed:
                      print(f"{case.get('classname', '?')}.{case.get('name', '?')}")
          PY
          head -n 50 diagnostics.txt | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/''}"
            echo "::error::${line}"
          done
          exit 0

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AutoLedger ${{ steps.meta.outputs.version }}
          files: autoledger.apk
          body: |
            AutoLedger ${{ steps.meta.outputs.version }}
            commit: ${{ github.sha }}
